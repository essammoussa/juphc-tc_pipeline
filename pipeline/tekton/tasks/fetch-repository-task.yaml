# pipeline/tekton/tasks/fetch-repository-task.yaml
#
# Clones the application's git repo into a shared workspace so later
# tasks (test, build, deploy) can all operate on the same source tree.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: fetch-repository
spec:
  params:
    - name: url
      description: Git repository URL to clone
      type: string
    - name: revision
      description: Git revision (branch, tag, or commit) to check out
      type: string
      default: main
  workspaces:
    - name: source
      description: Workspace where the repo will be cloned
  steps:
    - name: clone
      image: alpine/git:2.43.0
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Cloning $(params.url) @ $(params.revision)"
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" .
        echo "Clone complete. HEAD is at:"
        git log -1 --oneline
