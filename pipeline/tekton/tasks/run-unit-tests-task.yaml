# pipeline/tekton/tasks/run-unit-tests-task.yaml
#
# Objective 2: Run unit tests as part of the pipeline.
# If `npm test` exits non-zero (any Jest test fails), this Task step
# fails, which fails the Task, which fails the Pipeline — Tekton will
# NOT run any task that has `runAfter: [run-unit-tests]` (i.e. the
# build/deploy stages), satisfying Objective 3 ("deploy only when all
# tests pass") by construction rather than by a manual check.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: run-unit-tests
spec:
  workspaces:
    - name: source
      description: Workspace containing the cloned application source
  steps:
    - name: npm-install-and-test
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        #!/bin/sh
        set -eu
        echo "Installing dependencies..."
        npm ci
        echo "Running unit tests..."
        npm test
