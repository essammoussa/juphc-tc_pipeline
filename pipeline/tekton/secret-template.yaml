# pipeline/tekton/secret-template.yaml
#
# The deploy-code-engine task reads IBMCLOUD_API_KEY from this secret.
# DO NOT commit a real API key to git. Create it directly on your
# cluster instead, e.g.:
#
#   oc create secret generic ibmcloud-api-key \
#     --from-literal=apikey='<your-ibm-cloud-api-key>'
#
# or apply this file after replacing the placeholder.
apiVersion: v1
kind: Secret
metadata:
  name: ibmcloud-api-key
type: Opaque
stringData:
  apikey: "<replace-with-your-ibm-cloud-api-key>"
